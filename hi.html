<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teMperature Converter</title>
    <style>
        @keyframes jitter {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        body {
            text-align: right;
            background: repeating-linear-gradient(45deg, #ff0000, #00ff00 10px, #0000ff 10px, #ffff00 20px);
            font-family: "Comic Sans MS", "Chalkboard SE", cursive;
            margin-top: 50px;
            margin-left: 120px;
            height: 1000px;
            overflow: scroll;
            cursor: wait;
        }

        h1 {
            color: #00ffff;
            background-color: #ff00ff;
            font-size: 50px;
            text-shadow: 5px 5px 0px #000;
            transform: rotate(-7deg);
            letter-spacing: -3px;
        }

        #entrybox {
            position: relative;
            border: 10px dashed #ff0000;
            border-radius: 0px; 
            margin: 0;
            width: 450px;
            height: 250px;
            padding: 5px;
            background: magenta;
            box-shadow: inset 20px 20px 0px #00ff00;
        }

        #entrybox:hover {
            animation: jitter 0.1s infinite;
        }

        p {
            margin: 0;
        }

        #enterMsg {
            margin-bottom: 2px;
            font-size: 32px;
            color: #ffff00;
            background: #0000ff;
            text-transform: uppercase;
        }

        #input {
            height: 90px;
            width: 70px;
            border: 8px ridge #000;
            border-radius: 50px 0px 50px 0px;
            text-align: left;
            font-size: 10px;
            background-color: #00ff00;
            color: #ff0000;
            direction: rtl;
            transform: scaleY(-1);
        }

        #convert {
            height: 50px;
            border: 7px double #ffff00;
            border-radius: 0px;
            position: absolute;
            left: 200px;
            top: 150px;
            font-size: 25px;
            font-weight: 100;
            padding: 0px;
            background-color: #00ffff;
            color: #ff00ff;
            cursor: help;
        }

        #output {
            font-size: 40px;
            color: #00ff00;
            background-color: #000;
            border: 5px dotted #fff;
            width: 200px;
            word-break: break-all;
            transform: rotate(15deg);
            margin-top: 50px;
        }

        /* Video Popup Container */
        #video-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 10px ridge #ff0000;
            background: #000;
            z-index: 9999;
        }

        #video-container video {
            width: 480px;
            height: 360px;
        }
    </style>
</head>
<body>
    <h1>tEmpeRatuere coEnVertEr</h1>
    <div id="entrybox">
        <p id="enterMsg">Please enter temperature in °F: </p>
        <input id="input" type="number" placeholder="°F">
        <button id="convert" onclick="convert()">convert</button>
    </div>
    <p id="output"></p>

    <!-- Rickroll Video Player -->
    <div id="video-container">
        <video id="annoying-video" controls loop>
            <source src="https://archive.org/download/RickRoll_4fx/RickRoll.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>
</body>
<script type="text/javascript">
    const input = document.querySelector('#input');
    const convertBtn = document.querySelector('#convert');
    const entryBox = document.querySelector('#entrybox');
    const output = document.querySelector('#output');
    const videoContainer = document.querySelector('#video-container');
    const annoyingVideo = document.querySelector('#annoying-video');

    let escapes = 0;

    // Instant teleportation without smooth transition
    convertBtn.addEventListener("mouseenter", () => {
        if (escapes >= 8) {
            convertBtn.textContent = "Fine screw you";
            return;
        }
        escapes++;
        
        const maxX = window.innerWidth - convertBtn.offsetWidth;
        const maxY = window.innerHeight - convertBtn.offsetHeight;
        
        convertBtn.style.position = "fixed";
        convertBtn.style.left = Math.floor(Math.random() * maxX) + "px";
        convertBtn.style.top = Math.floor(Math.random() * maxY) + "px";
    });

    // Clear input if user misses the button
    entryBox.addEventListener("click", (e) => {
        if (e.target !== convertBtn) {
            input.value = "";
            output.textContent = "Oops, missed it!";
        }
    });

    // Convert function: triggers popups and plays the video
    function convert() {
        let F = input.value;
        if(!F){
            output.textContent = "please enter a number";
            return;
        }

        alert("ARE YOU SURE?");
        alert("REALLY SURE?");
        alert("CALCULATING... PLEASE WAIT...");

        F = parseFloat(F);
        const C = (F - 32) * 5 / 9;
        output.textContent = `temperature in °C: ${C.toFixed(2)}`;

        // Show and play the video popup
        videoContainer.style.display = "block";
        annoyingVideo.play();
    };
</script>
</html>
